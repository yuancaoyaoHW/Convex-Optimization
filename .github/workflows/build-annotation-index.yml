name: Build annotation index

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "translation/_build_annotated_pairs.py"
      - ".github/workflows/build-annotation-index.yml"

permissions:
  actions: write
  contents: write
  discussions: read

concurrency:
  group: annotation-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run GraphQL query and build index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python translation/_build_annotated_pairs.py

      - name: Commit if changed
        id: commit-index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet translation/annotated-pairs.json; then
            echo "no changes — skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add translation/annotated-pairs.json
            git commit -m "Update annotated-pairs index"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit-index.outputs.changed == 'true' || github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
